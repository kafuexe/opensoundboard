[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=2.0",
    "keyboard>=0.13",
    "yt-dlp",
    "requests>=2.31",
    "tkinterdnd2>=0.4",
]

[project.gui-scripts]
soundboard = "soundboard.ui.app:main"

[tool.setuptools.packages.find]
include = ["soundboard*"]
