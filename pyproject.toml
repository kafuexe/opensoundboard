[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard"
version = "0.1.0"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=2.0",
    "keyboard>=0.13",
    "yt-dlp[default]",  # [default] adds yt-dlp-ejs, needed for YouTube
    "requests>=2.31",
    "tkinterdnd2>=0.4",
    "pystray>=0.19",
    "pillow",
]

[project.gui-scripts]
soundboard = "soundboard.cli:main"

[tool.setuptools.packages.find]
include = ["soundboard*"]

[tool.setuptools.package-data]
soundboard = ["assets/*", "themes/*.css"]
