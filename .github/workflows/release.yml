# Push a tag like v0.2.0 and this builds Soundboard-Setup-0.2.0.exe and attaches it to a GitHub release.
# Run it by hand (Actions → Release → Run workflow) to just build the installer as an artifact.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./installer/build.ps1 -Version $version

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soundboard-Setup
          path: dist/Soundboard-Setup-*.exe

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Soundboard-Setup-*.exe
          generate_release_notes: true
